[package]
name = "jev-cli"
version = "2026.919.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atomic-write-file = "=0.3.0"
clap = { version = "4", features = ["derive"] }
dirs = "6"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
wiremock = "=0.6.4"
